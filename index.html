<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="stylesheet" href="style.css">
  <link rel="shortcut icon" type="image/jpg" href="./images/favicon.jpg">

<body>

  <section class="hero">
    <div class="left">
      <img src="images/HaverseXchange Logo.jpg" alt="HaverseXchange Logo" class="main-logo">

      <div class="social-icons">
        <span class="social-disabled" aria-label="Instagram">
          <img src="images/instagram.jpg" alt="Instagram">
        </span>

        <a href="https://www.facebook.com/HaverseXchange/" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
          <img src="images/facebook.png" alt="Facebook">
        </a>

        <span class="social-disabled" aria-label="X">
          <img src="images/X.jpg" alt="X">
        </span>
      </div>
    </div>

    <div class="right">
      <h1><span>Building Dream,</span> Growing Future.</h1>

      <a href="https://haverse.my/" target="_blank" rel="noopener noreferrer" class="menu-btn">
        ABOUT US
      </a>

      <a href="https://haversexchange.my.canva.site/termsncons" target="_blank" rel="noopener noreferrer" class="menu-btn">
        TERMS & CONDITION
      </a>

      <a href="https://wa.me/60189141898?text=Hi%2C%20I%20would%20like%20to%20know%20more%20about%20HaverseXchange."
         target="_blank"
         rel="noopener noreferrer"
         class="menu-btn">
        CONTACT US
      </a>

      <a href="https://www.jotform.com/form/242338493059059" target="_blank" rel="noopener noreferrer" class="signup-btn">
        SIGN UP NOW!
      </a>
    </div>
  </section>

  <section class="joined">
    <h2>Companies and Professionals Already Joining HaverseXchange</h2>

    <div class="logo-carousel">
      <div class="logo-track">

        <div class="logo-card">
          <img src="images/company 1.jpg" alt="Company 1">
        </div>

        <div class="logo-card">
          <img src="images/company 2.jpg" alt="Company 2">
        </div>

        <div class="logo-card">
          <img src="images/company 3.jpg" alt="Company 3">
        </div>

        <div class="logo-card">
          <img src="images/company 4.jpg" alt="Company 4">
        </div>

        <div class="logo-card">
          <img src="images/company 5.png" alt="Company 5">
        </div>

        <div class="logo-card">
          <img src="images/company 6.jpg" alt="Company 6">
        </div>

        <div class="logo-card">
          <img src="images/company 7.png" alt="Company 7">
        </div>

        <div class="logo-card">
          <img src="images/company 8.jpg" alt="Company 8">
        </div>

      </div>
    </div>
  </section>

  <script src="script.js"></script>
